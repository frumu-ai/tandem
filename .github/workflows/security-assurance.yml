name: Security Assurance

on:
  pull_request:
  push:
    branches: [main, "feat/engine"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-assurance-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: Assurance Policy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Verify secret-file history policy
        run: node scripts/verify-secret-file-policy.mjs --self-test

      - name: Verify container and deployment inventory policy
        run: node scripts/verify-container-hardening.mjs --self-test

      - name: Verify hosted release evidence gate
        run: node scripts/verify-security-release-evidence.mjs --self-test

      - name: Verify workflow action pins and permissions
        run: node scripts/verify-workflow-security.mjs

      - name: Test release candidate provenance and pin classification
        run: node --test scripts/ci-release-candidate.test.mjs scripts/ci-engine-pin-scope.test.mjs scripts/verify-workflow-security.test.mjs

  secret-history:
    name: Gitleaks All History
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Verify full history is available
        shell: bash
        run: |
          set -euo pipefail
          commit_count="$(git rev-list --all --count)"
          test "$commit_count" -gt 1
          echo "Scanning $commit_count commits across all fetched refs"

      - name: Scan all refs with pinned Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --network none \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --user "$(id -u):$(id -g)" \
            --volume "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE:ro" \
            --workdir "$GITHUB_WORKSPACE" \
            ghcr.io/gitleaks/gitleaks@sha256:cdbb7c955abce02001a9f6c9f602fb195b7fadc1e812065883f695d1eeaba854 \
            detect --source . --config .gitleaks.toml --log-opts=--all --redact --no-banner --exit-code 1

  codeql:
    name: CodeQL JavaScript and TypeScript
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4.36.0
        with:
          languages: javascript-typescript
          queries: security-extended

      - name: Analyze JavaScript and TypeScript
        uses: github/codeql-action/analyze@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4.36.0
        with:
          category: /language:javascript-typescript

  release-candidate:
    name: Linux Enterprise Release Composition
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      sha256: ${{ steps.candidate.outputs.sha256 }}
      manifest-sha256: ${{ steps.candidate.outputs.manifest-sha256 }}
      build-attempt: ${{ steps.candidate.outputs.build-attempt }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Detect reviewed engine pin change
        id: engine-pin
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            pull_request) base_sha="$PULL_REQUEST_BASE_SHA" ;;
            push) base_sha="$PUSH_BEFORE_SHA" ;;
            *)
              echo "changed=false" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac
          if [[ -z "$base_sha" || "$base_sha" == 0000000000000000000000000000000000000000 ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            pin_changed="$(node scripts/ci-engine-pin-scope.mjs "$base_sha" "$GITHUB_SHA")"
            echo "changed=$pin_changed" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup release Cargo fetch toolchain
        uses: ./.github/actions/setup-rust-ci
        with:
          cache-profile: linux-release-fetch
          targets: x86_64-unknown-linux-gnu
          toolchain: 1.95.0

      - name: Build Linux release engines in pinned environment
        run: ./scripts/build-linux-release-engine.sh with-enterprise

      - name: Record and verify the standard release candidate
        id: candidate
        shell: bash
        env:
          PIN_CHANGED: ${{ steps.engine-pin.outputs.changed }}
        run: |
          set -euo pipefail
          candidate_dir="$RUNNER_TEMP/tandem-release-candidate"
          mkdir -p "$candidate_dir"
          cp target/x86_64-unknown-linux-gnu/release/tandem-engine "$candidate_dir/tandem-engine"
          node scripts/ci-release-candidate.mjs write "$candidate_dir" > "$RUNNER_TEMP/candidate-pins.json"
          candidate_sha="$(jq -r .sha256 "$RUNNER_TEMP/candidate-pins.json")"
          echo "sha256=$candidate_sha" >> "$GITHUB_OUTPUT"
          echo "manifest-sha256=$(jq -r .manifest_sha256 "$RUNNER_TEMP/candidate-pins.json")" >> "$GITHUB_OUTPUT"
          echo "build-attempt=$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
          if [[ "$PIN_CHANGED" == true ]]; then
            pinned_sha="$(
              sed -nE \
                's/^[[:space:]]*TANDEM_ENGINE_BINARY_SHA256=([0-9a-f]{64}).*$/\1/p' \
                packages/tandem-control-panel/docker/engine.Dockerfile
            )"
            printf 'Pinned SHA-256: %s\nCandidate SHA-256: %s\n' "$pinned_sha" "$candidate_sha"
            test "$candidate_sha" = "$pinned_sha"
          fi
          expected_version="$(node -p "require('./packages/tandem-engine/package.json').version")"
          "$candidate_dir/tandem-engine" --version | grep -F "$expected_version"
          echo "Standard and enterprise-full engines built from $GITHUB_SHA using the pinned Rust 1.95.0 Linux builder." >> "$GITHUB_STEP_SUMMARY"
          echo "Standard candidate SHA-256: $candidate_sha" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the immutable standard candidate
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-engine-candidate-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/tandem-release-candidate/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  engine-container:
    name: Container engine
    needs: release-candidate
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Download only this run's producer artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.release-candidate.outputs.artifact-id }}
          path: ${{ runner.temp }}/tandem-release-candidate
          merge-multiple: true

      - name: Verify candidate provenance before packaging or executing
        shell: bash
        env:
          EXPECTED_MANIFEST: ${{ needs.release-candidate.outputs.manifest-sha256 }}
          EXPECTED_BINARY: ${{ needs.release-candidate.outputs.sha256 }}
          CANDIDATE_BUILD_ATTEMPT: ${{ needs.release-candidate.outputs.build-attempt }}
        run: |
          set -euo pipefail
          downloaded="$RUNNER_TEMP/tandem-release-candidate"
          node scripts/ci-release-candidate.mjs verify "$downloaded" "$EXPECTED_MANIFEST" "$EXPECTED_BINARY"
          candidate_dir=packages/tandem-control-panel/docker/release-candidate
          install -m 0555 "$downloaded/tandem-engine" "$candidate_dir/tandem-engine"
          npm pack ./packages/tandem-engine --pack-destination "$candidate_dir"
          echo "Reused release candidate from this workflow run; no second Rust release build." >> "$GITHUB_STEP_SUMMARY"

      - name: Build and scan the engine image
        uses: ./.github/actions/container-assurance
        with:
          name: engine
          dockerfile: packages/tandem-control-panel/docker/engine.Dockerfile
          image: tandem-engine:security-assurance
          build_args: |
            TANDEM_ENGINE_INSTALL_SOURCE=candidate
            TANDEM_ENGINE_CANDIDATE_SHA256=${{ needs.release-candidate.outputs.sha256 }}

  containers:
    name: Container ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: control-panel
            runner: ubuntu-24.04
            dockerfile: packages/tandem-control-panel/docker/control-panel.Dockerfile
            image: tandem-control-panel:security-assurance
          - name: linux-release-builder
            runner: ubuntu-22.04
            dockerfile: scripts/linux-release-builder.Dockerfile
            image: tandem-linux-release-builder:security-assurance
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build and scan the image
        uses: ./.github/actions/container-assurance
        with:
          name: ${{ matrix.name }}
          dockerfile: ${{ matrix.dockerfile }}
          image: ${{ matrix.image }}

  result:
    name: Security Assurance Result
    if: always()
    needs: [policy, secret-history, codeql, release-candidate, engine-container, containers]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every assurance job to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node - <<'NODE'
          const results = JSON.parse(process.env.RESULTS);
          for (const [name, job] of Object.entries(results)) {
            console.log(`${name}: ${job.result}`);
            if (job.result !== "success") process.exitCode = 1;
          }
          NODE
