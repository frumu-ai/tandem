name: Solution Contract

on:
  pull_request:
    paths:
      - "crates/**"
      - "specs/solutions/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/actions/setup-rust-ci/**"
      - ".github/workflows/solution-contract.yml"
  push:
    branches: [main, "feat/engine"]
    paths:
      - "crates/**"
      - "specs/solutions/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/actions/setup-rust-ci/**"
      - ".github/workflows/solution-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  contract:
    name: Solution planning contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup shared Rust CI
        uses: ./.github/actions/setup-rust-ci
        with:
          cache-profile: solutions-contract
          toolchain: 1.98.0
          components: clippy

      # Covers generated schema drift as well as the resolver. A schema-only
      # edit must run this check without triggering the full engine matrix.
      - name: Test solution planning contract
        run: cargo test -p tandem-solutions --locked

      - name: Lint solution contract and fixture
        run: cargo clippy -p tandem-solutions --all-targets --locked -- -D warnings

  customer-state:
    name: Customer configuration storage
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: tandem
          POSTGRES_DB: tandem
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tandem"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TANDEM_TEST_POSTGRES_URL: postgres://postgres:tandem@localhost:5432/tandem
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-rust-ci
        with:
          cache-profile: customer-config-storage
          toolchain: 1.98.0
          components: clippy
      - name: Verify protected customer configuration on both backends
        run: cargo test -p tandem-server --locked --features storage-postgres customer_config_ --lib -- --test-threads=1
      - name: Verify protected configuration survives backend round trip
        run: cargo test -p tandem-server --locked --features storage-postgres stateful_runtime::orchestration_store::transfer --lib -- --test-threads=1
      - name: Verify durable solution staging on both backends
        run: cargo test -p tandem-server --locked --features storage-postgres solution_installation_ --lib -- --test-threads=1
      - name: Lint the PostgreSQL and SQLite store adapter
        run: cargo clippy -p tandem-server --locked --features storage-postgres --lib -- -D warnings
