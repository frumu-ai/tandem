name: Hosted policy authority
on:
  pull_request:
    paths:
      - 'crates/**'
      - '.github/workflows/hosted-policy.yml'
  push:
    branches: [main, 'release/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hosted-policy-${{ github.ref }}
  cancel-in-progress: true
jobs:
  policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: ./.github/actions/setup-rust-ci
        with:
          cache-profile: hosted-policy
          components: rustfmt
      - name: Verify native planning fallback regressions actually execute
        run: |
          set -euo pipefail
          cargo test -p tandem-core --locked --lib hosted_plan_fallback_ -- --list > "$RUNNER_TEMP/hosted-plan-fallback-tests.txt"
          for tandem_plan_test_name in \
            hosted_plan_fallback_todo_writer_wait_rechecks_revocation \
            hosted_plan_fallback_question_writer_wait_rechecks_revocation \
            hosted_plan_fallback_todo_preserves_current_authority \
            hosted_plan_fallback_question_preserves_current_authority \
            hosted_plan_fallback_todo_preserves_standalone_without_hook \
            hosted_plan_fallback_question_preserves_standalone_without_hook \
            hosted_plan_fallback_todo_sql_failure_has_no_final_success \
            hosted_plan_fallback_question_sql_failure_has_no_synthetic_question \
            hosted_plan_fallback_todo_retains_original_prompt_authority \
            hosted_plan_fallback_question_retains_original_prompt_authority \
            hosted_plan_fallback_todo_keeps_write_and_events_inside_authority \
            hosted_plan_fallback_question_keeps_write_and_events_inside_authority
          do
            if ! grep -Fxq "engine_loop::tests::plan_fallback_authority::$tandem_plan_test_name: test" "$RUNNER_TEMP/hosted-plan-fallback-tests.txt"; then
              echo "Missing planning fallback regression: $tandem_plan_test_name" >&2
              exit 1
            fi
          done
          cargo test -p tandem-core --locked --lib hosted_plan_fallback_ -- --nocapture --test-threads=1
      - name: Verify narrow planning storage and repository guards
        run: |
          set -euo pipefail
          cargo test -p tandem-core --locked --lib plan_write_tests:: -- --list > "$RUNNER_TEMP/plan-write-tests.txt"
          for tandem_plan_test_name in \
            storage::session_repository::plan_write_tests::guarded_plan_repository_denial_and_skipped_commit_preserve_existing_rows \
            storage::session_repository::plan_write_tests::guarded_plan_repository_sql_failure_rolls_back_without_success_publication \
            storage::session_repository::plan_write_tests::guarded_plan_repository_double_continuation_reports_committed_first_result \
            storage::session_repository::plan_write_tests::guarded_todo_repository_loads_latest_metadata_after_sqlite_writer_release \
            storage::plan_write_tests::guarded_plan_storage_todos_publish_exact_normalized_persisted_values \
            storage::plan_write_tests::guarded_plan_storage_question_publishes_exact_prepared_tenant_digest_tool_and_ttl \
            storage::plan_write_tests::guarded_plan_storage_denial_skipped_commit_and_empty_question_publish_nothing \
            storage::plan_write_tests::guarded_plan_storage_cancellation_retains_question_writer_through_commit_and_callback \
            storage::plan_write_tests::guarded_plan_storage_cancelled_denial_rolls_back_before_question_writer_release
          do
            if ! grep -Fxq "$tandem_plan_test_name: test" "$RUNNER_TEMP/plan-write-tests.txt"; then
              echo "Missing native planning storage regression: $tandem_plan_test_name" >&2
              exit 1
            fi
          done
          cargo test -p tandem-core --locked --lib plan_write_tests::
          cargo test -p tandem-core --locked --lib fallback_correlation
      - name: Verify planning fallbacks with real hosted policy
        run: |
          set -euo pipefail
          cargo test -p tandem-server --locked --lib hosted_policy::tests::session_commit::planning_commit:: -- --list > "$RUNNER_TEMP/hosted-plan-server-tests.txt"
          for tandem_plan_test_name in \
            hosted_plan_todo_real_policy_writer_wait_rejects_v5_revocation \
            hosted_plan_question_real_policy_fifo_writer_wait_rejects_v5_revocation \
            hosted_plan_todo_real_policy_preserves_current_authority_and_publication \
            hosted_plan_question_real_policy_preserves_current_authority_and_publication \
            hosted_plan_todo_real_policy_uses_original_assertion_after_header_renewal \
            hosted_plan_question_real_policy_uses_original_assertion_after_header_renewal \
            hosted_plan_todo_real_sql_failure_preserves_canonical_state \
            hosted_plan_question_real_sql_failure_emits_no_synthetic_success
          do
            if ! grep -Fxq "hosted_policy::tests::session_commit::planning_commit::$tandem_plan_test_name: test" "$RUNNER_TEMP/hosted-plan-server-tests.txt"; then
              echo "Missing real hosted planning regression: $tandem_plan_test_name" >&2
              exit 1
            fi
          done
          cargo test -p tandem-server --locked --lib hosted_policy::tests::session_commit::planning_commit:: -- --nocapture --test-threads=1
      - name: Validate hosted policy contract
        run: cargo test -p tandem-enterprise-contract hosted_policy --lib
      - name: Verify global memory sharing and conservative schema upgrade
        run: |
          cargo test -p tandem-memory global_sharing --lib
          cargo test -p tandem-server tenant_shared_stamp_keeps_private_owner_and_explicit_department --lib
      - name: Verify canonical native message digest tests actually execute
        run: |
          set -euo pipefail
          prefix='memory_lineage::tests::'
          cargo test -p tandem-types --locked --lib "$prefix" -- --list > "$RUNNER_TEMP/tan829-types-lineage-list.txt"
          for test_name in \
            digest_binds_role_ordered_parts_and_nested_tool_values \
            digest_excludes_lineage_and_lineage_survives_header_json_roundtrip \
            digest_canonicalizes_nested_object_key_order
          do
            grep -Fxq "${prefix}${test_name}: test" "$RUNNER_TEMP/tan829-types-lineage-list.txt" || {
              echo "Missing native message digest regression: $test_name" >&2
              exit 1
            }
          done
          cargo test -p tandem-types --locked --lib "$prefix" -- --nocapture --test-threads=1 | tee "$RUNNER_TEMP/tan829-types-lineage-results.txt"
          grep -Eq 'test result: ok\. 3 passed; 0 failed; 0 ignored; 0 measured;' "$RUNNER_TEMP/tan829-types-lineage-results.txt"
      - name: Verify real engine message lineage tests actually execute
        run: |
          set -euo pipefail
          prefix='engine_loop::message_lineage::tests::'
          cargo test -p tandem-core --locked --lib "$prefix" -- --list > "$RUNNER_TEMP/tan829-core-lineage-list.txt"
          for test_name in \
            accepted_input_inherits_valid_canonical_assistant_sources_transitively \
            modified_or_foreign_assistant_manifest_is_not_complete_or_inherited \
            legacy_assistant_unknown_tools_and_incomplete_hooks_keep_private_floor \
            unaccepted_or_malformed_source_input_cannot_claim_completeness \
            lineage_keeps_original_verified_subject_and_tenant_after_context_changes \
            compact_history_tracks_only_actual_selected_native_inputs \
            real_engine_final_lineage_survives_native_header_storage_and_cold_reopen \
            rejected_provider_input_does_not_persist_a_prepared_source_manifest
          do
            grep -Fxq "${prefix}${test_name}: test" "$RUNNER_TEMP/tan829-core-lineage-list.txt" || {
              echo "Missing real engine message lineage regression: $test_name" >&2
              exit 1
            }
          done
          cargo test -p tandem-core --locked --lib "$prefix" -- --nocapture --test-threads=1 | tee "$RUNNER_TEMP/tan829-core-lineage-results.txt"
          grep -Eq 'test result: ok\. 8 passed; 0 failed; 0 ignored; 0 measured;' "$RUNNER_TEMP/tan829-core-lineage-results.txt"
      - name: Verify prompt memory inclusion lineage tests actually execute
        run: |
          set -euo pipefail
          prefix='app::state::prompt_memory_context::lineage_tests::'
          cargo test -p tandem-server --locked --lib "$prefix" -- --list > "$RUNNER_TEMP/tan829-prompt-lineage-list.txt"
          for test_name in \
            manifest_contains_only_budget_included_canonical_records \
            whole_block_deferral_has_no_source_manifest_or_provider_text \
            malformed_included_restriction_preserves_rendering_but_is_incomplete \
            successful_memory_gate_captures_reference_but_unknown_docs_are_incomplete
          do
            grep -Fxq "${prefix}${test_name}: test" "$RUNNER_TEMP/tan829-prompt-lineage-list.txt" || {
              echo "Missing prompt memory inclusion regression: $test_name" >&2
              exit 1
            }
          done
          cargo test -p tandem-server --locked --lib "$prefix" -- --nocapture --test-threads=1 | tee "$RUNNER_TEMP/tan829-prompt-lineage-results.txt"
          grep -Eq 'test result: ok\. 4 passed; 0 failed; 0 ignored; 0 measured;' "$RUNNER_TEMP/tan829-prompt-lineage-results.txt"
      - name: Verify derived memory storage lineage tests actually execute
        run: |
          set -euo pipefail
          prefix='derived_lineage::tests::'
          cargo test -p tandem-memory --locked --lib "$prefix" -- --list > "$RUNNER_TEMP/tan829-memory-lineage-list.txt"
          for test_name in \
            private_owner_is_additional_to_source_grants_and_knowledge_scope \
            canonical_department_shared_source_allows_peer_and_denies_foreign_department \
            tenant_shared_source_does_not_need_an_invented_department_floor \
            deleted_source_is_hidden_by_read_list_search_and_cold_reopen \
            tombstoned_connector_object_invalidates_derivative_without_deleting_memory \
            manager_resolver_seam_preserves_private_chunk_positive_and_denial \
            source_privacy_tightening_invalidates_the_old_derivative \
            identical_shared_private_and_distinct_lineage_writes_do_not_dedupe \
            unresolved_or_malformed_lineage_cannot_disclose_records_or_copied_chunks \
            native_inputs_and_private_sources_cannot_be_relabelled_shared \
            nested_class_union_retains_specific_sources_and_native_internal_floor \
            output_policy_cannot_erase_inherited_write_promotion_or_retention_limits \
            current_source_grant_is_required_after_proof_resolution \
            knowledge_registry_grant_without_connector_binding_remains_a_shared_positive
          do
            grep -Fxq "${prefix}${test_name}: test" "$RUNNER_TEMP/tan829-memory-lineage-list.txt" || {
              echo "Missing derived memory storage regression: $test_name" >&2
              exit 1
            }
          done
          cargo test -p tandem-memory --locked --lib "$prefix" -- --nocapture --test-threads=1 | tee "$RUNNER_TEMP/tan829-memory-lineage-results.txt"
          grep -Eq 'test result: ok\. 14 passed; 0 failed; 0 ignored; 0 measured;' "$RUNNER_TEMP/tan829-memory-lineage-results.txt"
      - name: Verify SQLite derived-memory commit guards actually execute
        run: |
          set -euo pipefail
          prefix='db::sqlite_commit_authority::tests::'
          cargo test -p tandem-memory --locked --lib "$prefix" -- --list > "$RUNNER_TEMP/tan829-sqlite-commit-list.txt"
          for test_name in \
            guarded_sqlite_insert_and_context_update_rollback_on_precommit_denial \
            guarded_sqlite_context_update_preserves_lineage_dedupe_and_private_owner
          do
            grep -Fxq "${prefix}${test_name}: test" "$RUNNER_TEMP/tan829-sqlite-commit-list.txt" || {
              echo "Missing SQLite commit authority regression: $test_name" >&2
              exit 1
            }
          done
          cargo test -p tandem-memory --locked --lib "$prefix" -- --nocapture --test-threads=1 | tee "$RUNNER_TEMP/tan829-sqlite-commit-results.txt"
          grep -Eq 'test result: ok\. 2 passed; 0 failed; 0 ignored; 0 measured;' "$RUNNER_TEMP/tan829-sqlite-commit-results.txt"
      - name: Verify derived memory consolidation tests actually execute
        run: |
          set -euo pipefail
          prefix='manager::lineage_consolidation_tests::'
          cargo test -p tandem-memory --locked --lib "$prefix" -- --list > "$RUNNER_TEMP/tan829-memory-consolidation-list.txt"
          for test_name in \
            consolidation_preserves_lineage_classes_and_hides_summary_after_source_deletion \
            consolidation_denied_grant_or_missing_native_resolver_never_dispatches_provider \
            consolidation_rechecks_source_after_provider_before_summary_write
          do
            grep -Fxq "${prefix}${test_name}: test" "$RUNNER_TEMP/tan829-memory-consolidation-list.txt" || {
              echo "Missing derived memory consolidation regression: $test_name" >&2
              exit 1
            }
          done
          cargo test -p tandem-memory --locked --lib "$prefix" -- --nocapture --test-threads=1 | tee "$RUNNER_TEMP/tan829-memory-consolidation-results.txt"
          grep -Eq 'test result: ok\. 3 passed; 0 failed; 0 ignored; 0 measured;' "$RUNNER_TEMP/tan829-memory-consolidation-results.txt"
      - name: Verify governed memory provider egress tests actually execute
        run: |
          set -euo pipefail
          prefix='provider_egress::tests::'
          cargo test -p tandem-memory --locked --lib "$prefix" -- --list > "$RUNNER_TEMP/tan829-memory-egress-list.txt"
          for test_name in \
            memory_kinds_carry_trusted_semantic_classes \
            strict_redaction_never_sends_raw_memory_prompt \
            semantic_approval_uses_continuation_and_missing_continuation_fails_closed \
            required_audit_failure_blocks_memory_provider_dispatch \
            inherited_source_classes_reach_the_real_egress_audit_without_detector_spans
          do
            grep -Fxq "${prefix}${test_name}: test" "$RUNNER_TEMP/tan829-memory-egress-list.txt" || {
              echo "Missing governed memory provider egress regression: $test_name" >&2
              exit 1
            }
          done
          cargo test -p tandem-memory --locked --lib "$prefix" -- --nocapture --test-threads=1 | tee "$RUNNER_TEMP/tan829-memory-egress-results.txt"
          grep -Eq 'test result: ok\. 5 passed; 0 failed; 0 ignored; 0 measured;' "$RUNNER_TEMP/tan829-memory-egress-results.txt"
      - name: Verify canonical derived-memory lineage regressions actually execute
        run: |
          set -euo pipefail
          cargo test -p tandem-server --locked --lib 'http::tests::workflow_learning::derived_memory_lineage::' -- --list > "$RUNNER_TEMP/tan829-derived-lineage-tests.txt"
          for tan829_test_name in \
            tan_829_private_canonical_session_fact_survives_cold_reopen_without_peer_access \
            tan_829_shared_only_canonical_source_remains_visible_to_same_department \
            tan_829_financial_source_grant_preserves_class_and_cross_department_recall \
            tan_829_mixed_sources_use_separate_provider_prompts_and_separate_acls \
            tan_829_client_lineage_and_modified_conversation_cannot_authorize_a_write \
            tan_829_omitted_selectors_still_use_only_owned_canonical_private_text \
            tan_829_foreign_session_and_private_source_fail_before_extraction \
            tan_829_incomplete_assistant_and_modified_durable_lineage_fail_closed \
            tan_829_complete_canonical_assistant_inherits_private_input_scope \
            tan_829_privacy_compatible_dedupe_never_reuses_a_broader_record \
            tan_829_approved_private_promotion_preserves_owner_on_cold_http_recall \
            tan_829_deleted_shared_source_hides_derived_recall_and_candidate \
            tan_829_corrected_private_message_hides_retained_derived_output \
            tan_829_workflow_injection_uses_current_execution_identity_and_source_scope \
            tan_829_revocation_during_real_provider_extraction_persists_nothing
          do
            if ! grep -Fxq "http::tests::workflow_learning::derived_memory_lineage::$tan829_test_name: test" "$RUNNER_TEMP/tan829-derived-lineage-tests.txt"; then
              echo "Missing derived-memory lineage regression: $tan829_test_name" >&2
              exit 1
            fi
          done
          cargo test -p tandem-server --locked --lib 'http::tests::workflow_learning::derived_memory_lineage::' -- --nocapture --test-threads=1 | tee "$RUNNER_TEMP/tan829-derived-lineage-results.txt"
          grep -Eq 'test result: ok\. 15 passed; 0 failed; 0 ignored; 0 measured;' "$RUNNER_TEMP/tan829-derived-lineage-results.txt"
      - name: Verify hosted derived-memory writer-wait regressions actually execute
        run: |
          set -euo pipefail
          prefix='http::skills_memory::derived_lineage_commit_tests::'
          cargo test -p tandem-server --locked --lib "$prefix" -- --list > "$RUNNER_TEMP/tan829-server-commit-list.txt"
          for test_name in \
            tan_829_memory_insert_rechecks_original_identity_after_actual_sqlite_writer_wait \
            tan_829_memory_insert_rechecks_snapshot_expiry_after_actual_sqlite_writer_wait \
            tan_829_memory_update_rechecks_original_identity_after_actual_sqlite_writer_wait \
            tan_829_cancelled_memory_wait_retains_policy_guard_until_native_commit \
            tan_829_memory_commit_preserves_standalone_without_skipping_configured_hosted_authority
          do
            grep -Fxq "${prefix}${test_name}: test" "$RUNNER_TEMP/tan829-server-commit-list.txt" || {
              echo "Missing hosted derived-memory writer-wait regression: $test_name" >&2
              exit 1
            }
          done
          cargo test -p tandem-server --locked --lib "$prefix" -- --nocapture --test-threads=1 | tee "$RUNNER_TEMP/tan829-server-commit-results.txt"
          grep -Eq 'test result: ok\. 5 passed; 0 failed; 0 ignored; 0 measured;' "$RUNNER_TEMP/tan829-server-commit-results.txt"
      - name: Validate scoped key lifecycle and administrative authority
        run: |
          cargo test -p tandem-server context_assertion_security --lib
          cargo test -p tandem-server action_authorization --lib
      - name: Verify encrypted global storage and conservative local reopening
        run: |
          set -euo pipefail
          cargo test -p tandem-memory --locked --lib 'db::tests::' -- --list > "$RUNNER_TEMP/hosted-memory-tests.txt"
          for tandem_memory_test_name in \
            hosted_chunk_round_trips_and_is_ciphertext_at_rest \
            hosted_read_without_a_principal_fails_closed \
            cross_tenant_principal_cannot_read_another_tenants_memory \
            wrong_data_class_principal_is_denied \
            local_mode_leaves_crypto_envelope_null_and_reads_back \
            hosted_layer_seals_content_and_reads_back_under_principal \
            hosted_global_chunk_is_returned_by_vector_search \
            source_binding_data_class_drives_the_key_scope \
            hosted_global_record_cold_decrypt_search_and_sqlite_artifacts_are_sealed \
            hosted_global_record_rejects_plaintext_legacy_and_scope_change \
            hosted_atomic_global_write_and_context_update_remain_sealed \
            local_key_global_search_still_matches_decrypted_content \
            hosted_global_optional_metadata_removal_is_detected \
            hosted_mixed_class_search_skips_denied_rows_but_rejects_corruption \
            reset_keeps_plaintext_history_unusable_for_hosted \
            hosted_reset_requires_fresh_storage \
            reopened_legacy_unknown_still_accepts_local_writes
          do
            if ! grep -Fxq "db::tests::$tandem_memory_test_name: test" "$RUNNER_TEMP/hosted-memory-tests.txt"; then
              echo "Missing hosted encryption/reopening test: $tandem_memory_test_name" >&2
              exit 1
            fi
          done
          cargo test -p tandem-memory --locked --lib 'db::tests::'
      - name: Validate current runtime authority and persisted revision
        run: cargo test -p tandem-server hosted_policy --lib
      - name: Verify revocation after approval and before provider dispatch
        run: cargo test -p tandem-core hosted_policy --lib
      - name: Verify final response commit regressions actually execute
        run: |
          set -euo pipefail
          cargo test -p tandem-core --locked --lib hosted_final_assistant_writer_wait -- --list > "$RUNNER_TEMP/hosted-final-response-tests.txt"
          for tandem_final_test_name in \
            hosted_final_assistant_writer_wait_rechecks_revoked_authority \
            hosted_final_assistant_writer_wait_preserves_current_authority \
            hosted_final_assistant_writer_wait_preserves_standalone_without_hook \
            hosted_final_assistant_writer_wait_keeps_commit_and_success_events_inside_authority \
            hosted_final_assistant_writer_wait_insert_failure_has_no_final_success \
            hosted_final_assistant_writer_wait_retains_original_prompt_authority_after_renewal
          do
            if ! grep -Fxq "engine_loop::tests::hosted_policy::$tandem_final_test_name: test" "$RUNNER_TEMP/hosted-final-response-tests.txt"; then
              echo "Missing final response commit regression: $tandem_final_test_name" >&2
              exit 1
            fi
          done
          cargo test -p tandem-core --locked --lib hosted_final_assistant_writer_wait
      - name: Verify real hosted final response commit regressions actually execute
        run: |
          set -euo pipefail
          cargo test -p tandem-server --locked --lib hosted_policy::tests::session_commit -- --list > "$RUNNER_TEMP/hosted-final-response-server-tests.txt"
          for tandem_final_test_name in \
            hosted_final_assistant_rechecks_real_policy_after_sqlite_writer_wait \
            hosted_final_assistant_holds_policy_through_events_and_cancelled_caller \
            hosted_final_commit_preserves_local_and_fails_closed_without_policy_or_identity
          do
            if ! grep -Fxq "hosted_policy::tests::session_commit::$tandem_final_test_name: test" "$RUNNER_TEMP/hosted-final-response-server-tests.txt"; then
              echo "Missing real hosted final response commit regression: $tandem_final_test_name" >&2
              exit 1
            fi
          done
          cargo test -p tandem-server --locked --lib hosted_policy::tests::session_commit
      - name: Verify direct provider and recovery compatibility
        run: |
          cargo test -p tandem-server session_run_retry --lib
          cargo test -p tandem-server workflow_planner_transport --lib
          cargo test -p tandem-server mission_builder_host --lib
      - name: Verify production approval route with scoped dispatch
        run: cargo test -p tandem-server --features acme-demo acme_slack_demo --lib
      - name: Check formatting
        id: fmt
        if: ${{ always() }}
        run: cargo fmt --check
      - name: Prepare formatting repair patch on hosted runner
        id: fmt_repair
        if: ${{ always() && steps.fmt.outcome == 'failure' }}
        run: |
          set -euo pipefail
          cargo fmt --all
          git diff --binary -- '*.rs' > "$RUNNER_TEMP/hosted-policy-fmt-repair.patch"
          test -s "$RUNNER_TEMP/hosted-policy-fmt-repair.patch"
          test "$(wc -c < "$RUNNER_TEMP/hosted-policy-fmt-repair.patch")" -le 1048576
      - name: Upload formatting repair patch
        if: ${{ always() && steps.fmt.outcome == 'failure' && steps.fmt_repair.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hosted-policy-fmt-repair-${{ github.sha }}
          path: ${{ runner.temp }}/hosted-policy-fmt-repair.patch
          if-no-files-found: error
          retention-days: 7
      - name: Check enterprise server compatibility
        run: cargo check -p tandem-enterprise-server
      - name: Verify hosted registry ownership boundary
        run: cargo test -p tandem-enterprise-server hosted_policy --lib
      - name: Verify native organization registry HTTP compatibility
        run: cargo test -p tandem-enterprise-server --test enterprise_http enterprise_org_unit
      - name: Verify scoped hosted administration compatibility
        run: cargo test -p tandem-enterprise-server --test hosted_admin_compatibility
      - name: Verify provider retry revocation and request isolation
        run: cargo test -p tandem-providers --lib
      - name: Verify MCP revocation after readiness and before network dispatch
        run: cargo test -p tandem-runtime mcp --lib
