name: Hosted policy authority
on:
  pull_request:
    paths:
      - 'crates/**'
      - '.github/workflows/hosted-policy.yml'
  push:
    branches: [main, 'release/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hosted-policy-${{ github.ref }}
  cancel-in-progress: true
jobs:
  policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: ./.github/actions/setup-rust-ci
        with:
          cache-profile: hosted-policy
          components: rustfmt
      - name: Validate hosted policy contract
        run: cargo test -p tandem-enterprise-contract hosted_policy --lib
      - name: Verify global memory sharing and conservative schema upgrade
        run: |
          cargo test -p tandem-memory global_sharing --lib
          cargo test -p tandem-server tenant_shared_stamp_keeps_private_owner_and_explicit_department --lib
      - name: Validate scoped key lifecycle and administrative authority
        run: |
          cargo test -p tandem-server context_assertion_security --lib
          cargo test -p tandem-server action_authorization --lib
      - name: Verify encrypted global storage and conservative local reopening
        run: |
          set -euo pipefail
          cargo test -p tandem-memory --locked --lib 'db::tests::' -- --list > "$RUNNER_TEMP/hosted-memory-tests.txt"
          for tandem_memory_test_name in \
            hosted_chunk_round_trips_and_is_ciphertext_at_rest \
            hosted_read_without_a_principal_fails_closed \
            cross_tenant_principal_cannot_read_another_tenants_memory \
            wrong_data_class_principal_is_denied \
            local_mode_leaves_crypto_envelope_null_and_reads_back \
            hosted_layer_seals_content_and_reads_back_under_principal \
            hosted_global_chunk_is_returned_by_vector_search \
            source_binding_data_class_drives_the_key_scope \
            hosted_global_record_cold_decrypt_search_and_sqlite_artifacts_are_sealed \
            hosted_global_record_rejects_plaintext_legacy_and_scope_change \
            hosted_atomic_global_write_and_context_update_remain_sealed \
            local_key_global_search_still_matches_decrypted_content \
            hosted_global_optional_metadata_removal_is_detected \
            hosted_mixed_class_search_skips_denied_rows_but_rejects_corruption \
            reset_keeps_plaintext_history_unusable_for_hosted \
            hosted_reset_requires_fresh_storage \
            reopened_legacy_unknown_still_accepts_local_writes
          do
            if ! grep -Fxq "db::tests::$tandem_memory_test_name: test" "$RUNNER_TEMP/hosted-memory-tests.txt"; then
              echo "Missing hosted encryption/reopening test: $tandem_memory_test_name" >&2
              exit 1
            fi
          done
          cargo test -p tandem-memory --locked --lib 'db::tests::'
      - name: Validate current runtime authority and persisted revision
        run: cargo test -p tandem-server hosted_policy --lib
      - name: Verify revocation after approval and before provider dispatch
        run: cargo test -p tandem-core hosted_policy --lib
      - name: Verify direct provider and recovery compatibility
        run: |
          cargo test -p tandem-server session_run_retry --lib
          cargo test -p tandem-server workflow_planner_transport --lib
          cargo test -p tandem-server mission_builder_host --lib
      - name: Verify production approval route with scoped dispatch
        run: cargo test -p tandem-server --features acme-demo acme_slack_demo --lib
      - name: Check formatting
        run: cargo fmt --check
      - name: Check enterprise server compatibility
        run: cargo check -p tandem-enterprise-server
      - name: Verify hosted registry ownership boundary
        run: cargo test -p tandem-enterprise-server hosted_policy --lib
      - name: Verify native organization registry HTTP compatibility
        run: cargo test -p tandem-enterprise-server --test enterprise_http enterprise_org_unit
      - name: Verify scoped hosted administration compatibility
        run: cargo test -p tandem-enterprise-server --test hosted_admin_compatibility
      - name: Verify provider retry revocation and request isolation
        run: cargo test -p tandem-providers --lib
      - name: Verify MCP revocation after readiness and before network dispatch
        run: cargo test -p tandem-runtime mcp --lib
