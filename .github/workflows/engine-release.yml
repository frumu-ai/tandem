name: Engine Release

on:
  push:
    tags:
      - "engine-v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag to release (e.g., v0.1.0-beta.1)"
        required: false

permissions:
  contents: read

jobs:
  build-engine:
    name: ${{ matrix.artifact }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
            artifact: tandem-engine-windows-x64
          - os: macos-13
            target: x86_64-apple-darwin
            archive: zip
            artifact: tandem-engine-darwin-x64
          - os: macos-14
            target: aarch64-apple-darwin
            archive: zip
            artifact: tandem-engine-darwin-arm64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
            artifact: tandem-engine-linux-x64
            enterprise_artifact: tandem-engine-enterprise-linux-x64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
            artifact: tandem-engine-linux-arm64
        # Add TUI targets (simplified to mirror engine for now, assuming same support)
        # Actually, let's just build both in the same job or separate jobs?
        # Same job simplifies matrix. We can build both binaries.

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.release_tag || github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: |
            . -> target

      - name: Install Linux ARM64 linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: |
          cargo build --release --target ${{ matrix.target }} -p tandem-ai -p tandem-tui -p tandem-browser --features tandem-ai/browser,tandem-ai/enterprise

      - name: Build Linux enterprise engine with local embeddings
        if: ${{ matrix.enterprise_artifact }}
        shell: bash
        run: |
          set -euo pipefail
          cp "target/${{ matrix.target }}/release/tandem-engine" "target/${{ matrix.target }}/release/tandem-engine-standard"
          cargo build --release --target ${{ matrix.target }} -p tandem-ai --features tandem-ai/browser,tandem-ai/enterprise-full
          cp "target/${{ matrix.target }}/release/tandem-engine" "target/${{ matrix.target }}/release/tandem-engine-enterprise"
          cp "target/${{ matrix.target }}/release/tandem-engine-standard" "target/${{ matrix.target }}/release/tandem-engine"

      - name: Package zip (Windows)
        if: matrix.archive == 'zip' && startsWith(matrix.target, 'x86_64-pc-windows')
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/tandem-engine.exe" "dist/tandem-engine.exe" -Force
          Copy-Item "target/${{ matrix.target }}/release/tandem-tui.exe" "dist/tandem-tui.exe" -Force
          Copy-Item "target/${{ matrix.target }}/release/tandem-browser.exe" "dist/tandem-browser.exe" -Force
          # Create separate zips for engine and tui to match downloader expectation: artifact-os-arch.zip
          Compress-Archive -Path "dist/tandem-engine.exe" -DestinationPath "${{ matrix.artifact }}.zip" -Force
          Compress-Archive -Path "dist/tandem-tui.exe" -DestinationPath "tandem-tui-${{ matrix.os == 'windows-latest' && 'windows' || 'win32' }}-x64.zip" -Force
          # Wait, matrix.artifact is 'tandem-engine-windows-x64'.
          # We want 'tandem-tui-windows-x64.zip'.
          $TuiArtifact = "${{ matrix.artifact }}".Replace("engine", "tui")
          Compress-Archive -Path "dist/tandem-tui.exe" -DestinationPath "$TuiArtifact.zip" -Force
          $BrowserArtifact = "${{ matrix.artifact }}".Replace("engine", "browser")
          Compress-Archive -Path "dist/tandem-browser.exe" -DestinationPath "$BrowserArtifact.zip" -Force

      - name: Package zip (macOS)
        if: matrix.archive == 'zip' && !startsWith(matrix.target, 'x86_64-pc-windows')
        shell: bash
        run: |
          mkdir -p dist
           cp "target/${{ matrix.target }}/release/tandem-engine" dist/
           cp "target/${{ matrix.target }}/release/tandem-tui" dist/
           cp "target/${{ matrix.target }}/release/tandem-browser" dist/
           cd dist
           # Zip individual binaries?
           # Downloader expects: tandem-engine-darwin-x64.zip
           zip -j "../${{ matrix.artifact }}.zip" tandem-engine
           
           # Tui artifact name construction
           TUI_ARTIFACT=$(echo "${{ matrix.artifact }}" | sed 's/engine/tui/')
           zip -j "../$TUI_ARTIFACT.zip" tandem-tui
           BROWSER_ARTIFACT=$(echo "${{ matrix.artifact }}" | sed 's/engine/browser/')
           zip -j "../$BROWSER_ARTIFACT.zip" tandem-browser

      - name: Package tar.gz (Linux)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          mkdir -p dist
           cp "target/${{ matrix.target }}/release/tandem-engine" dist/
           cp "target/${{ matrix.target }}/release/tandem-tui" dist/
           cp "target/${{ matrix.target }}/release/tandem-browser" dist/
           if [ -n "${{ matrix.enterprise_artifact || '' }}" ]; then
             cp "target/${{ matrix.target }}/release/tandem-engine-enterprise" dist/
           fi
           
           tar -czf "${{ matrix.artifact }}.tar.gz" -C dist tandem-engine
           if [ -n "${{ matrix.enterprise_artifact || '' }}" ]; then
             mkdir -p dist/enterprise
             cp dist/tandem-engine-enterprise dist/enterprise/tandem-engine
             tar -czf "${{ matrix.enterprise_artifact }}.tar.gz" -C dist/enterprise tandem-engine
           fi
           
           TUI_ARTIFACT=$(echo "${{ matrix.artifact }}" | sed 's/engine/tui/')
           tar -czf "$TUI_ARTIFACT.tar.gz" -C dist tandem-tui
           BROWSER_ARTIFACT=$(echo "${{ matrix.artifact }}" | sed 's/engine/browser/')
           tar -czf "$BROWSER_ARTIFACT.tar.gz" -C dist tandem-browser

      - name: Upload release zip asset
        if: matrix.archive == 'zip'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          draft: true
          files: |
            ${{ matrix.artifact }}.zip
            tandem-tui-*.zip
            tandem-browser-*.zip

      - name: Upload release tarball asset
        if: matrix.archive == 'tar.gz'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          draft: true
          files: |
            ${{ matrix.artifact }}.tar.gz
            tandem-tui-*.tar.gz
            tandem-browser-*.tar.gz

      - name: Upload enterprise engine tarball asset
        if: ${{ matrix.enterprise_artifact }}
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          draft: true
          files: ${{ matrix.enterprise_artifact }}.tar.gz

  sign-runtime-manifest:
    name: Sign Runtime Artifact Manifest
    needs: build-engine
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: write
      id-token: write
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          ref: ${{ inputs.release_tag || github.ref_name }}

      - name: Download runtime assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir release-artifacts
          gh release download "$RELEASE_TAG" \
            --dir release-artifacts \
            --pattern 'tandem-engine-*.zip' \
            --pattern 'tandem-engine-*.tar.gz' \
            --pattern 'tandem-tui-*.zip' \
            --pattern 'tandem-tui-*.tar.gz' \
            --pattern 'tandem-browser-*.zip' \
            --pattern 'tandem-browser-*.tar.gz'

      - name: Generate deterministic manifest and SPDX SBOMs
        shell: bash
        env:
          SOURCE_REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#engine-v}"
          VERSION="${VERSION#v}"
          SOURCE_COMMIT="$(git rev-parse HEAD)"
          GENERATED_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          node scripts/generate-artifact-manifest.mjs \
            --assets-dir release-artifacts \
            --output-dir release-artifacts \
            --release "$RELEASE_TAG" \
            --version "$VERSION" \
            --repository "$SOURCE_REPOSITORY" \
            --commit "$SOURCE_COMMIT" \
            --workflow .github/workflows/engine-release.yml \
            --run-id "$RUN_ID" \
            --generated-at "$GENERATED_AT"

      - name: Setup pnpm for locked signing CLI
        uses: pnpm/action-setup@eae0cfeb286e66ffb5155f1a79b90583a127a68b # v2
        with:
          version: 11.17.0

      - name: Setup Node.js for locked signing CLI
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: apps/tandem-desktop/pnpm-lock.yaml

      - name: Install locked signing and verification tools
        run: |
          pnpm -C apps/tandem-desktop install --frozen-lockfile
          sudo apt-get update
          sudo apt-get install -y minisign

      - name: Sign runtime manifest
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          pnpm -C apps/tandem-desktop exec tauri signer sign \
            -k "$TAURI_SIGNING_PRIVATE_KEY" \
            -p "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" \
            release-artifacts/tandem-artifacts-v1.json
          base64 --decode \
            release-artifacts/tandem-artifacts-v1.json.sig \
            > release-artifacts/tandem-artifacts-v1.json.minisig
          test -s release-artifacts/tandem-artifacts-v1.json.minisig
          jq -r .plugins.updater.pubkey \
            apps/tandem-desktop/src-tauri/tauri.conf.json \
            | base64 --decode > "$RUNNER_TEMP/tandem-artifact-public.key"
          minisign -Vm release-artifacts/tandem-artifacts-v1.json \
            -x release-artifacts/tandem-artifacts-v1.json.minisig \
            -p "$RUNNER_TEMP/tandem-artifact-public.key"

      - name: Attest runtime artifact provenance
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: |
            release-artifacts/tandem-*.zip
            release-artifacts/tandem-*.tar.gz

      - name: Upload signed manifest and SBOMs
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" --clobber \
            release-artifacts/tandem-artifacts-v1.json \
            release-artifacts/tandem-artifacts-v1.json.minisig \
            release-artifacts/*.sbom.spdx.json

  publish-release:
    name: Publish Signed Engine Release
    needs: sign-runtime-manifest
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - name: Publish signed engine release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release edit "$RELEASE_TAG" --draft=false
